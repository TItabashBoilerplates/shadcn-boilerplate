
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
exclude = [
    '^\.venv/',
    '^tests/',  # テストコードは pytest 等 SDK の型解決が複雑なため strict 対象外
]
strict = true
ignore_missing_imports = true
install_types = true
non_interactive = true

[tool.ruff]
# Same as Black.
line-length = 88

# Assume Python 3.11.
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN1",   # missing type self and cls
    "D1",     # undocumented
    "TD001",  # invalid todo tag
    "TD002",  # missing todo author
    "TD003",  # missing todo link
    "PD011",  # pandas use of dot values
    "B008",
    "COM812", # conflicts with formatter
    "TC",     # flake8-type-checking: pydantic/SQLModel evaluate annotations at runtime
]
unfixable = [
    "F401",   # unused import
    "F841",   # unused variable
    "ERA001", # commented out code
]

logger-objects = ["src.library.logger.LOGGER"]

[tool.ruff.lint.per-file-ignores]
# テストコード固有の許容: assert は当然、fixture/型注釈/import 規則は緩める
"tests/**/*.py" = [
    "S101",     # assert は pytest テストで必須
    "ANN001",   # 関数引数の型注釈 (pytest fixture は推論で十分)
    "ANN201",   # 戻り値の型注釈 (テスト関数は None 固定)
    "ANN202",   # 内部関数の戻り値型注釈
    "ANN401",   # Any 型 (テストでは許容)
    "ARG002",   # 未使用引数 (pytest fixture 名で注入)
    "PLR2004",  # マジックナンバー (200, 500 等の HTTP ステータス)
    "PLC0415",  # トップレベル import (importlib.reload を伴うテストで必要)
    "F401",     # 未使用 import (テストで一時的に存在することがある)
    "F841",     # 未使用変数 (テストで意図的に存在することがある)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["controller", "usecase", "gateway", "domain", "infra", "middleware"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.fastapi]
# Used by `fastapi dev` / `fastapi run`. The src layout requires
# PYTHONPATH=src (see devenv.nix backendExec) for `app:app` to resolve.
entrypoint = "app:app"

[project]
name = "backend-py"
version = "0.1.0"
description = "FastAPI + Supabase auth boilerplate skeleton"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi",
    "starlette",
    "uvicorn[standard]",
    # orjson is used by structlog's JSONRenderer in production
    # (see util/logging.py). The == pin existed for a transient ASGI bug
    # that was fixed upstream; use a floor-only constraint so security
    # patches land automatically.
    "orjson >=3.10.14",

    # Auth / DB
    "supabase",
    "sqlmodel",
    "psycopg2-binary",

    # Logging
    "structlog",
]

[dependency-groups]
dev = [
    # Linting & Formatting & Type Checking
    "ruff",
    "mypy",

    # Testing
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
    "testcontainers[postgres]",
    "httpx",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

