# E2E: パスワード再設定の往復（6 桁コード方式）
#
# ## なぜモバイルはコード方式なのか
#
# 1. スパム対策（Microsoft Defender の Safe Links 等）がメール中のリンクを
#    先に開いて**消費してしまう**問題は Supabase が公式に Limitations として
#    挙げている既知の不具合で、公式の回避策の 1 つ目が「`{{ .Token }}` を使った
#    OTP 方式にする」こと。
# 2. ディープリンクはスキーム登録や `additional_redirect_urls` など環境要因で
#    無言に壊れる箇所が多い。
#
# したがってこのフローは、`recovery` テンプレートに `{{ .Token }}` が
# 入っていることの回帰テストにもなっている（消すとここで落ちる）。
#
# ローカル専用（Mailpit + service_role が要る）。

appId: ${APP_ID}
name: "Mobile E2E - Password reset round trip"
jsEngine: graaljs
tags:
  - mobile
  - e2e
  - auth
  - mailbox
  # メール本文のリンク/コードを実際に使う = `supabase/config.toml` で
  # `[auth.email.template.*]` が配線されていることが前提（既定テンプレートは
  # token_hash 形式ではないので /auth/confirm に着地できない）。
  # runner が config.toml の有無を見て自動で出し入れする。
  - needs-email-templates
  - admin

env:
  APP_ID: ${APP_ID}
  MOBILE_SCHEME: ${MOBILE_SCHEME || "mobile"}
  SUPABASE_URL: ${SUPABASE_URL || "http://localhost:54321"}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY || ""}
  MAIL_API_URL: ${MAIL_API_URL || "http://localhost:54324"}
  TEST_PASSWORD: ${TEST_PASSWORD || "E2ePassw0rd!x"}
  NEW_PASSWORD: ${NEW_PASSWORD || "N3wPassw0rd!x"}

onFlowStart:
  - runScript:
      file: ../../scripts/ensure-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        TEST_PASSWORD: ${TEST_PASSWORD}

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true
    permissions:
      all: allow

# 1. ログイン画面から再設定へ進めること
- openLink: ${MOBILE_SCHEME}://sign-in
- tapOn: ".*Forgot your password.*"
- assertVisible: "Reset your password"
- takeScreenshot: mobile-e2e-reset-01-reset-request

# 2. コードを申請
- tapOn:
    id: "email"
- inputText: ${output.testEmail}
- hideKeyboard
- tapOn:
    id: "send-reset-code-submit"

# 3. 応答はアカウントの存在を漏らさない文言であること
- extendedWaitUntil:
    visible: ".*If an account exists.*"
    timeout: 30000
- takeScreenshot: mobile-e2e-reset-02-code-sent

# 4. メールから 6 桁コードを取り出す（テンプレートに {{ .Token }} が必要）
- runScript:
    file: ../../scripts/get-auth-email.js
    env:
      MAIL_API_URL: ${MAIL_API_URL}
      TO_EMAIL: ${output.testEmail}
      SUBJECT_MATCH: "Reset"
      MAX_RETRIES: "30"

# 5. コードと新パスワードを入力
- tapOn:
    id: "code"
- inputText: ${output.otpCode}
- tapOn:
    id: "password"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "passwordConfirmation"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "update-password-submit"

- extendedWaitUntil:
    visible: ".*Your password has been updated.*"
    timeout: 30000

# 6. 実際に新しいパスワードでログインできること
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${output.testEmail}
      PASSWORD: ${NEW_PASSWORD}
- takeScreenshot: mobile-e2e-reset-03-signed-in-with-new-password
