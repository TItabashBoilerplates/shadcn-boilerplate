# E2E: メールアドレス + パスワードでログインできること（Mobile）
#
# **審査担当者が通る経路そのもの**。渡せるのはメールアドレスとパスワードの組
# だけなので、この経路だけでログインし切れる状態を必ず保つ
# （OTP のみは App Store 2.1(a) でリジェクト。`.claude/rules/auth.md`）。
#
# ローカルでは使い捨てユーザーを作り、リモートでは `E2E_EMAIL` /
# `E2E_PASSWORD`（＝審査用デモアカウント）を使う。後者は**消さない**。
#
# ## Android エミュレータからのホストアクセス
# エミュレータは独自の仮想ネットワークにいるので、ホストの localhost は
# `10.0.2.2` になる。runner (`scripts/e2e/maestro.sh`) が `--platform android`
# のときに SUPABASE_URL / MAIL_API_URL を差し替える。

appId: ${APP_ID}
name: "Mobile E2E - Password login"
jsEngine: graaljs
tags:
  - mobile
  - e2e
  - auth
  - smoke

env:
  APP_ID: ${APP_ID}
  MOBILE_SCHEME: ${MOBILE_SCHEME || "mobile"}
  SUPABASE_URL: ${SUPABASE_URL || "http://localhost:54321"}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY || ""}
  E2E_EMAIL: ${E2E_EMAIL || ""}
  E2E_PASSWORD: ${E2E_PASSWORD || ""}
  TEST_PASSWORD: ${TEST_PASSWORD || "E2ePassw0rd!x"}

onFlowStart:
  - runScript:
      file: ../../scripts/ensure-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        E2E_EMAIL: ${E2E_EMAIL}
        E2E_PASSWORD: ${E2E_PASSWORD}
        TEST_PASSWORD: ${TEST_PASSWORD}

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${output.testEmail}
      PASSWORD: ${output.testPassword}

- takeScreenshot: mobile-e2e-login-01-home-after-login

# 設定画面に必須の 3 導線が揃っていること
# （メール変更 / パスワード変更 / アカウント削除。App Store 5.1.1(v)）
- openLink: ${MOBILE_SCHEME}://account
- extendedWaitUntil:
    visible: "Account settings"
    timeout: 30000
- assertVisible: "New email address"
# 設定画面は縦に長い。初期表示に無いものはスクロールしてから確かめる。
- scrollUntilVisible:
    element:
      text: "Current password"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    timeout: 20000
- takeScreenshot: mobile-e2e-login-02-account-settings
