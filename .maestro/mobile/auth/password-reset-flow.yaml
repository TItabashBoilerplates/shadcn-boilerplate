# Mobile: パスワード再設定（6 桁コード方式）の往復
#
# ディープリンクではなくコードを使う理由は 2 つ:
#   1. スパム対策（Safe Links 等）がメールのリンクを先に開いて消費してしまう
#      問題は Supabase 公式が Limitations として挙げる既知の不具合で、
#      公式の回避策の 1 つ目が「{{ .Token }} の OTP 方式にする」こと
#   2. ディープリンクはスキーム登録や additional_redirect_urls など
#      環境要因で無言に壊れる箇所が多い
#
# よってこのフローは `recovery` テンプレートに {{ .Token }} が入っていることの
# 回帰テストにもなっている（消すとここで落ちる）。

appId: ${APP_ID}
name: "Mobile Password Reset Round Trip"
jsEngine: graaljs
tags:
  - auth
  - mobile
  - e2e

env:
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  MAILPIT_URL: ${MAILPIT_URL}

onFlowStart:
  - runScript:
      file: ../../scripts/setup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        TEST_PASSWORD: "E2ePassw0rd!x"

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true
    permissions:
      all: allow

# 1. ログイン画面から再設定へ進めること
- openLink: "mobile://sign-in"
- tapOn: "Forgot your password?"
- assertVisible: "Reset your password"

# 2. コードを申請
- tapOn: "Email address"
- inputText: ${output.testEmail}
- tapOn: "Send code"

# 3. 応答はアカウントの存在を漏らさない文言であること
- assertVisible: "If an account exists"

# 4. メールから 6 桁コードを取り出す（テンプレートに {{ .Token }} が必要）
- runScript:
    file: ../../scripts/get-auth-email.js
    env:
      MAILPIT_URL: ${MAILPIT_URL}
      TO_EMAIL: ${output.testEmail}
      SUBJECT_MATCH: "Reset"
      MAX_RETRIES: "20"

# 5. コードと新パスワードを入力
- tapOn: "Verification code"
- inputText: ${output.otpCode}
- tapOn: "New password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Confirm new password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Update password"

# 6. 実際に新しいパスワードでログインできること
- assertVisible: "Sign in"
- tapOn: "Email address"
- inputText: ${output.testEmail}
- tapOn: "Password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Sign in"
- assertNotVisible: "Forgot your password?"
- takeScreenshot: mobile-password-reset-success
