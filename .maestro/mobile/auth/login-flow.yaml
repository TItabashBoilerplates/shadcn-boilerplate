# Mobile: メールアドレス + パスワードでログインする
#
# **審査担当者が通る経路そのもの**。App Store Review Guideline 2.1(a) は
# 「an active demo account ... login credentials」の提供を求めるが、渡せるのは
# メールアドレスとパスワードの組だけ。OTP しか無いと担当者は受信箱に触れられず
# ログインできないまま 2.1 でリジェクトされる（`.claude/rules/auth.md`）。
#
# したがって「この経路だけでログインし切れる」ことは E2E で守る価値がある。

appId: ${APP_ID}
name: "Mobile Password Login"
jsEngine: graaljs
tags:
  - auth
  - mobile
  - e2e

env:
  # Android エミュレータからホストの localhost は 10.0.2.2。
  # iOS シミュレータは localhost で届く。
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  MAILPIT_URL: ${MAILPIT_URL}

onFlowStart:
  - runScript:
      file: ../../scripts/setup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        TEST_PASSWORD: "E2ePassw0rd!x"

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true
    permissions:
      all: allow

# expo-router の /sign-in へ直接入る
- openLink: "mobile://sign-in"

- assertVisible: "Sign in"
- assertVisible: "Email address"
# パスワードを忘れた人はログインできない = この画面に導線が無いと詰む
- assertVisible: "Forgot your password?"

- tapOn: "Email address"
- inputText: ${output.testEmail}

- tapOn: "Password"
- inputText: ${output.testPassword}

- tapOn: "Sign in"

# ログイン後はホームへ戻る
- assertNotVisible: "Sign in"
- takeScreenshot: mobile-password-login-success
