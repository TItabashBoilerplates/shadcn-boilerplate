# E2E: メールアドレス + パスワードでログインし、必須の設定導線まで到達できること
#
# **審査担当者が通る経路そのもの**。App Store Review Guideline 2.1(a) は
# 「an active demo account ... login credentials」の提供を求めるが、渡せるのは
# メールアドレスとパスワードの組だけ。OTP しか無いと担当者は受信箱に触れられず
# 2.1 でリジェクトされる（`.claude/rules/auth.md`）。
#
# ## ローカルでもリモートでも走る
#
# アカウントの用意は `ensure-test-user.js` に委ねてある:
#   - ローカル … service_role で使い捨てユーザーを作り、最後に消す
#   - リモート … `E2E_EMAIL` / `E2E_PASSWORD`（＝審査用デモアカウント）を使う。
#     消さない。
# つまり **production に対して走らせると「デモアカウントがまだ生きているか」の
# 監視になる**。

url: ${WEB_BASE_URL}
name: "Web E2E - Password login"
jsEngine: graaljs
tags:
  - web
  - e2e
  - auth
  - smoke

env:
  WEB_BASE_URL: ${WEB_BASE_URL || "http://localhost:3000"}
  LOCALE: ${LOCALE || "en"}
  SUPABASE_URL: ${SUPABASE_URL || "http://localhost:54321"}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY || ""}
  E2E_EMAIL: ${E2E_EMAIL || ""}
  E2E_PASSWORD: ${E2E_PASSWORD || ""}
  TEST_PASSWORD: ${TEST_PASSWORD || "E2ePassw0rd!x"}

onFlowStart:
  - runScript:
      file: ../../scripts/ensure-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        E2E_EMAIL: ${E2E_EMAIL}
        E2E_PASSWORD: ${E2E_PASSWORD}
        TEST_PASSWORD: ${TEST_PASSWORD}

onFlowComplete:
  # USER_ID が空（= リモートで既存アカウントを使った）なら何もしない。
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true

- openLink: ${WEB_BASE_URL}/${LOCALE}/login
- takeScreenshot: web-e2e-login-01-login-screen

- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${output.testEmail}
      PASSWORD: ${output.testPassword}

# ログインしたユーザーの情報が出ていること（セッションがサーバー側で
# 確立できているかは、ここが空でないことでしか分からない）
- assertVisible: ${output.testEmail}
- takeScreenshot: web-e2e-login-02-dashboard

# 設定画面に「必須の 3 導線」が揃っていること
#   メール変更 / パスワード変更 / アカウント削除
# （`.claude/rules/auth.md` §2、App Store 5.1.1(v)）
- openLink: ${WEB_BASE_URL}/${LOCALE}/account
- extendedWaitUntil:
    visible: "Account settings"
    timeout: 30000
- assertVisible: "Email address"
# ⚠️ Web の assertVisible は**ビューポート内**しか見ない。設定画面は縦に長く、
# 「パスワード変更」「アカウント削除」は初期表示では画面外にある（実測で踏んだ）。
# 見えるところまでスクロールしてから確かめる。
- scrollUntilVisible:
    element:
      text: "Current password"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Delete account"
    direction: DOWN
    timeout: 20000
- takeScreenshot: web-e2e-login-03-account-settings
