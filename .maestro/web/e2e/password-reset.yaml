# E2E: パスワード再設定の往復（申請 → メール受信 → 新パスワード → 再ログイン）
#
# 「送信できた」で終わらせない。**メールを受け取って確定し、実際に新しい
# パスワードでログインできるところまで**通す（`.claude/rules/auth.md` §6）。
# ここを踏まないと、リンクの形式ミス（token_hash ではなく ConfirmationURL を
# 使ってしまう等）や `/auth/confirm` の配線ミスに気づけない。
#
# ## ローカル専用（`mailbox` / `admin` タグ）
#
# Mailpit（`supabase start` が立てるメールサーバ）と service_role が要る。
# `config.remote.yaml` では除外される。

url: ${WEB_BASE_URL}
name: "Web E2E - Password reset round trip"
jsEngine: graaljs
tags:
  - web
  - e2e
  - auth
  - mailbox
  # メール本文のリンク/コードを実際に使う = `supabase/config.toml` で
  # `[auth.email.template.*]` が配線されていることが前提（既定テンプレートは
  # token_hash 形式ではないので /auth/confirm に着地できない）。
  # runner が config.toml の有無を見て自動で出し入れする。
  - needs-email-templates
  - admin

env:
  WEB_BASE_URL: ${WEB_BASE_URL || "http://localhost:3000"}
  LOCALE: ${LOCALE || "en"}
  SUPABASE_URL: ${SUPABASE_URL || "http://localhost:54321"}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY || ""}
  MAIL_API_URL: ${MAIL_API_URL || "http://localhost:54324"}
  TEST_PASSWORD: ${TEST_PASSWORD || "E2ePassw0rd!x"}
  NEW_PASSWORD: ${NEW_PASSWORD || "N3wPassw0rd!x"}

onFlowStart:
  - runScript:
      file: ../../scripts/ensure-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        TEST_PASSWORD: ${TEST_PASSWORD}

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    clearState: true

# 1. ログイン画面から再設定へ進めること
- openLink: ${WEB_BASE_URL}/${LOCALE}/login
- tapOn: ".*Forgot your password.*"
- assertVisible: "Reset your password"
- takeScreenshot: web-e2e-reset-01-reset-request

# 2. 申請
- tapOn:
    id: "email"
- inputText: ${output.testEmail}
- tapOn:
    id: "send-reset-link-submit"

# 3. 応答はアカウントの存在を漏らさない文言であること（ユーザー列挙の防止）
- extendedWaitUntil:
    visible: ".*If an account exists.*"
    timeout: 30000
- takeScreenshot: web-e2e-reset-02-reset-requested

# 4. メールから確認 URL を取り出す
- runScript:
    file: ../../scripts/get-auth-email.js
    env:
      MAIL_API_URL: ${MAIL_API_URL}
      TO_EMAIL: ${output.testEmail}
      SUBJECT_MATCH: "Reset"
      MAX_RETRIES: "30"

# 5. /auth/confirm が token_hash を検証してセッションを張り、設定画面へ送る
- openLink: ${output.confirmUrl}
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 30000
- takeScreenshot: web-e2e-reset-03-choose-new-password

# 6. 新しいパスワードを設定
- tapOn:
    id: "password"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "passwordConfirmation"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "update-password-submit"
- extendedWaitUntil:
    visible: ".*Your password has been updated.*"
    timeout: 30000
- takeScreenshot: web-e2e-reset-04-password-updated

# 7. 実際に新しいパスワードでログインできること
#    （ここまでやって初めて「往復した」と言える）
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${output.testEmail}
      PASSWORD: ${NEW_PASSWORD}
- takeScreenshot: web-e2e-reset-05-signed-in-with-new-password
