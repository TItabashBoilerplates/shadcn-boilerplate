# Web: メールアドレス + パスワードでログインする
#
# `.claude/rules/auth.md` により、モバイルアプリを配布するプロダクトでは
# これが主たるログイン手段でなければならない（OTP のみは App Store 2.1(a) で
# リジェクトされる）。Web も同じ資格情報で入れる必要があるため、この経路を守る。

appId: com.example.web
name: "Web Password Login"
jsEngine: graaljs
tags:
  - auth
  - web
  - e2e

env:
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  MAILPIT_URL: ${MAILPIT_URL}

onFlowStart:
  - runScript:
      file: ../../scripts/setup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        # パスワードポリシー（12 文字以上 + 大小英字 + 数字 + 記号）を満たす値。
        # ここを緩くすると Supabase 側で弾かれてフロー全体が落ちる。
        TEST_PASSWORD: "E2ePassw0rd!x"

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
- launchApp:
    arguments:
      url: "http://localhost:3000/en/login"

- assertVisible: "Sign in"
- assertVisible: "Email address"
# パスワードを忘れた人はログインできない = この画面に導線が無いと詰む。
# 導線が消えていないことを E2E でも守る。
- assertVisible: "Forgot your password?"

- tapOn:
    id: "email"
- inputText: ${output.testEmail}

- tapOn:
    id: "password"
- inputText: ${output.testPassword}

- tapOn: "Sign in"

- assertVisible: "Dashboard"
- takeScreenshot: web-password-login-success
