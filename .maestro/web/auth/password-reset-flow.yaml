# Web: パスワード再設定の往復（申請 → メール受信 → 新パスワード → 再ログイン）
#
# 「送信できた」で終わらせない。**メールを受け取って確定し、実際に新しい
# パスワードでログインできるところまで**通す（`.claude/rules/auth.md` §6）。
# ここを踏まないと、リンクの形式ミス（token_hash でなく ConfirmationURL）や
# /auth/confirm の配線ミスに気づけない。

appId: com.example.web
name: "Web Password Reset Round Trip"
jsEngine: graaljs
tags:
  - auth
  - web
  - e2e

env:
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  MAILPIT_URL: ${MAILPIT_URL}

onFlowStart:
  - runScript:
      file: ../../scripts/setup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        TEST_PASSWORD: "E2ePassw0rd!x"

onFlowComplete:
  - runScript:
      file: ../../scripts/cleanup-test-user.js
      env:
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        USER_ID: ${output.userId}

---
# 1. ログイン画面から再設定へ進めること
- launchApp:
    arguments:
      url: "http://localhost:3000/en/login"
- tapOn: "Forgot your password?"
- assertVisible: "Reset your password"

# 2. 申請
- tapOn:
    id: "email"
- inputText: ${output.testEmail}
- tapOn: "Send reset link"

# 3. 応答はアカウントの存在を漏らさない文言であること
- assertVisible: "If an account exists"

# 4. メールから確認 URL を取り出す
- runScript:
    file: ../../scripts/get-auth-email.js
    env:
      MAILPIT_URL: ${MAILPIT_URL}
      TO_EMAIL: ${output.testEmail}
      SUBJECT_MATCH: "Reset"
      MAX_RETRIES: "20"

# 5. /auth/confirm が token_hash を検証してセッションを張り、設定画面へ送る
- openLink: ${output.confirmUrl}
- assertVisible: "Choose a new password"

# 6. 新しいパスワードを設定
- tapOn:
    id: "password"
- inputText: "N3wPassw0rd!x"
- tapOn:
    id: "passwordConfirmation"
- inputText: "N3wPassw0rd!x"
- tapOn: "Update password"
- assertVisible: "Your password has been updated."

# 7. 実際に新しいパスワードでログインできること（ここまでやって初めて往復が通る）
- openLink: "http://localhost:3000/en/login"
- tapOn:
    id: "email"
- inputText: ${output.testEmail}
- tapOn:
    id: "password"
- inputText: "N3wPassw0rd!x"
- tapOn: "Sign in"
- assertVisible: "Dashboard"
- takeScreenshot: web-password-reset-success
