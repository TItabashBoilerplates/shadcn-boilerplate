[package]
name = "app-desktop"
version = "0.1.0"
description = "Desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

# Tauri は lib（モバイル対応の共通エントリ）と bin（デスクトップ）の 2 本立てにする。
# 公式スキャフォールドと同じ構成なので、後から `tauri android init` 等を足せる。
[lib]
name = "app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 自動更新（latest.json の確認・署名検証・インストール）と、更新後の再起動。
# 更新の仕組みは自作しない（.claude/rules/minimal-implementation.md: 公式プラグインを使う）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# 既定で有効にはしない（`tauri dev` が必要に応じて付ける）
custom-protocol = ["tauri/custom-protocol"]
