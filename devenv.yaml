inputs:
  devenv:
    url: git+https://github.com/cachix/devenv?dir=src/modules&ref=refs/heads/main&rev=e30eb49258bee68353bd9c619823f635f4afa86c
  git-hooks:
    url: git+https://github.com/cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: git+https://github.com/NixOS/nixpkgs?ref=nixpkgs-unstable

# unfree ライセンスのパッケージを評価できるようにする。対象は 2 つ:
#   - Terraform（devenv.nix の terraformCli。BUSL-1.1 = `lib.licenses.bsl11`）
#   - Android SDK（`-P android` のときだけ評価される。Google の SDK ライセンス）
# 許可しないと "Refusing to evaluate package '...' because it has an unfree license" で
# devenv shell 自体に入れなくなる。
#
# キー名は **camelCase の `allowUnfree`** で書く。devenv CLI 2.0.x は `nixpkgs:` 配下を
# camelCase でしか読まず、snake_case の `allow_unfree` は未知キーとして無視される
# （生成される .devenv/nixpkgs-config-*.nix が `cfg = {}` になる）。2.1 以降は
# `allowUnfree` を alias として受け付けるので、この表記なら両方で通る。
# 出典: devenv v2.0.6 docs/src/devenv.schema.json（`nixpkgs.allowUnfree`）、
#       devenv v2.3 devenv-core/src/config.rs（`#[setting(alias = "allowUnfree")]`）。
nixpkgs:
  allowUnfree: true
