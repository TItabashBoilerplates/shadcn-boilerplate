version: 2
updates:
  # Frontend dependencies
  #
  # groups は「まとめたい」からではなく、open PR 数を上限内に保つために要る。
  # open-pull-requests-limit に張り付くと Dependabot は新規 PR を一切出さなくなり、
  # しかもそれを知らせない（2026-01〜09 に実際に 8 ヶ月間更新が止まった）。
  # versioning が連動していて 1 件ずつ出ると詰まるものは、必ずここで束ねる。
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "eslint-config-expo"
      next:
        patterns:
          - "next*"
      tailwind:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
      supabase:
        patterns:
          - "@supabase/*"
      lucide:
        patterns:
          - "lucide-*"

  # Drizzle dependencies
  - package-ecosystem: "npm"
    directory: "/drizzle"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      drizzle:
        patterns:
          - "drizzle-*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
