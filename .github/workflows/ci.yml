name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  ci-check:
    name: CI Check (lint + format + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      # Run all verify tasks. Each uses execIfModified caching, so unchanged
      # areas skip on subsequent runs. Equivalent to the ci:check aggregator's
      # dependencies but invoked directly to avoid devenv test's process phase
      # (which would spin up Supabase Docker + Storybook on every CI run).
      - name: Run verify tasks
        run: |
          devenv tasks run \
            lint-ci:frontend \
            lint-ci:drizzle \
            lint-ci:backend-py \
            lint-ci:functions \
            lint-ci:fsd \
            format-check:frontend \
            format-check:drizzle \
            format-check:backend-py \
            format-check:functions \
            type-check:frontend \
            type-check:mobile \
            type-check:backend-py \
            type-check:functions

  test:
    name: Unit Tests (frontend + backend-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - name: Run unit tests
        run: devenv shell test
