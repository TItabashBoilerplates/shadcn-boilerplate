name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一 PR / branch で後続の push が来たら走行中の workflow をキャンセルし、
# main / develop への直接 push は最後まで走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI（lint / format / type-check / unit-test）は**シークレット不要**。ローカル既定値は
# env/<svc>/.env.local から入るため、Doppler へ問い合わせる必要が無い。
# 仮に必要になっても、Doppler → GitHub のネイティブ sync 済みの値を `${{ secrets.* }}` で
# job env に渡せばよく、**Actions 内で doppler CLI を叩く必要は無い**
# （.claude/skills/doppler/references/cicd.md）。
# DOPPLER_SKIP=1 で devenv の Doppler ロードを明示的にスキップし、毎 run の
# 「⚠️ シークレット未ロード」警告（＝無視が常態化する類のノイズ）を出さない。
env:
  DOPPLER_SKIP: "1"

# 公式推奨: すべての `run:` を devenv shell 内で実行する。
# これにより `devenv:enterShell` hook が発火し、`before = [ "devenv:enterShell" ]`
# が付いた `setup:install-frontend` / `setup:install-drizzle` / `setup:install-backend`
# が lockfile 変更検知ベースで自動同期される（`bun install --frozen-lockfile` /
# `uv sync --frozen`）。
# Refs: https://devenv.sh/integrations/github-actions/
defaults:
  run:
    shell: devenv shell bash -- -e {0}

jobs:
  ci-check:
    name: CI Check (lint + format + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          # cache-nix-action 公式推奨。これがないと nix store の自動 GC で
          # devenv-shell の依存（中間ビルド成果物・derivation）が落ちて、
          # 2 回目以降に「あるはずのものが無い」状態になる。
          # Refs: https://github.com/nix-community/cache-nix-action
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      # /nix/store そのものを GHA cache に乗せる。
      # 旧構成は `actions/cache@v4` で `.devenv/` を抱えていたが、`.devenv/profile`
      # や `.devenv/gc/` が `/nix/store/...` への symlink を持つため、別 runner で
      # restore すると参照先実体が無く `no substituter that can build it` で失敗する。
      # cache-nix-action は `/nix/store` 自体を cache するので symlink 先の実体も揃う。
      # Refs: https://github.com/nix-community/cache-nix-action
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # GHA cache の上限 (10GB/repo) を考慮し /nix/store を 5GB に GC してから保存
          gc-max-store-size-linux: 5G
          # 古い cache を整理（primary-key と一致するものは保護）
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # devenv 公式 cachix を読み取り substituter として併用。
      # 初回（cache-nix-action が cold な状態）でも devenv 共通の依存物は
      # ここから引いてこられるので、build from source を回避できる。
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # node_modules は /nix/store 外に出るので別 cache。
      # uv venv は `.devenv/state/venv` だが、CI では `setup:install-backend` task が
      # `uv sync --frozen` で毎回再生成するため cache 不要。
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
            frontend/tooling/*/node_modules
            drizzle/node_modules
          # `v2-` は cache 世代。**古い cache を捨てたい時はここを上げる**。
          # v1 の頃は restore-keys の prefix fallback があったため、stale なツリーを
          # 掴んだまま成功した unit-test job がそれを exact key で保存してしまい、
          # fallback を外しただけでは「毒入りの exact key」を引き続き掴んでいた。
          key: v2-${{ runner.os }}-node-modules-${{ hashFiles('frontend/bun.lock', 'drizzle/bun.lock') }}
          # ⚠️ restore-keys（prefix fallback）は付けないこと。
          # 付けると lockfile hash が変わった時に**別の lockfile で作られた
          # node_modules がそのまま復元される**。しかも `bun install --frozen-lockfile`
          # は既存ツリーを浅く検証するだけ（実測「Checked 2075 installs (no changes)」）で
          # 中身が古いパッケージを修復しないため、stale なまま検査に入ってしまう。
          # さらに cache の保存は job 失敗時に skip されるので、CI が赤い間は
          # 古いツリーが延々と再利用され続ける。
          # exact key のみにすれば miss 時は空 → 下の Sync step が本物の install を行う。
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # ⚠️ この step は消さないこと（install を確実に走らせる唯一の場所）。
      #
      # `setup:install-frontend` / `setup:install-drizzle` は execIfModified 付きなので、
      # enterShell 経由だと **skip されて install が走らない**
      # （実測: CI の setup:install-frontend は bun の出力すら無く 103ms で完了 = 未実行。
      #  整合済みでも `bun install --frozen-lockfile` は 209ms かかり必ず出力が出る）。
      # ここは execIfModified を通らない素の `run:` なので必ず実行される。
      #
      # 上の cache を exact key のみにしてあるので、miss 時は node_modules が空の状態から
      # 本物の install が走る（＝ロックファイルと必ず一致したツリーになる）。
      # 差分があれば --frozen-lockfile が非 0 で落ちる（黙って直さない）。
      - name: Sync JS dependencies (install into a lockfile-matched tree)
        run: |
          cd "$DEVENV_ROOT/frontend" && bun install --frozen-lockfile
          cd "$DEVENV_ROOT/drizzle"  && bun install --frozen-lockfile
      # `ci-check` script = `devenv tasks run ci:check`（aggregator）。
      # `devenv test` は使わない: process phase が Supabase Docker / Storybook を起動し、
      # かつ prek (git-hooks) が verify task と並行実行されて false failure を出すため
      # （詳細は devenv.nix の task "ci:check" のコメント）。
      # verify task の一覧は devenv.nix の ci:check に一本化してあるので、
      # ここで列挙し直さない（列挙するとローカルと CI で drift する）。
      - name: Run verify tasks
        run: ci-check

  test:
    name: Unit Tests (frontend + backend-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
            frontend/tooling/*/node_modules
            drizzle/node_modules
          # `v2-` は cache 世代。**古い cache を捨てたい時はここを上げる**。
          # v1 の頃は restore-keys の prefix fallback があったため、stale なツリーを
          # 掴んだまま成功した unit-test job がそれを exact key で保存してしまい、
          # fallback を外しただけでは「毒入りの exact key」を引き続き掴んでいた。
          key: v2-${{ runner.os }}-node-modules-${{ hashFiles('frontend/bun.lock', 'drizzle/bun.lock') }}
          # ⚠️ restore-keys（prefix fallback）は付けないこと。
          # 付けると lockfile hash が変わった時に**別の lockfile で作られた
          # node_modules がそのまま復元される**。しかも `bun install --frozen-lockfile`
          # は既存ツリーを浅く検証するだけ（実測「Checked 2075 installs (no changes)」）で
          # 中身が古いパッケージを修復しないため、stale なまま検査に入ってしまう。
          # さらに cache の保存は job 失敗時に skip されるので、CI が赤い間は
          # 古いツリーが延々と再利用され続ける。
          # exact key のみにすれば miss 時は空 → 下の Sync step が本物の install を行う。
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # ci-check job と同じ理由（execIfModified による install の skip）。
      - name: Sync JS dependencies (install into a lockfile-matched tree)
        run: |
          cd "$DEVENV_ROOT/frontend" && bun install --frozen-lockfile
          cd "$DEVENV_ROOT/drizzle"  && bun install --frozen-lockfile
      - name: Run unit tests
        run: unit-test

  db-tests:
    name: DB Tests (pgTAP / supabase test db)
    runs-on: ubuntu-latest
    # Supabase 公式の CI 手順に対応するジョブ。
    #   https://supabase.com/docs/guides/deployment/ci/testing
    #     - uses: supabase/setup-cli@v3
    #     - run: supabase db start
    #     - run: supabase test db
    #
    # ■ 公式との違いは 1 点だけ: CLI の入手方法
    #   公式は `supabase/setup-cli` で CLI を入れるが、このリポジトリは
    #   **devenv（Nix）が supabase CLI を pin して提供する**のを唯一の経路に
    #   している（.claude/rules/commands.md）。setup-cli を足すと CLI の出所が
    #   2 つになり、**CI とローカルで別バージョンを使う**ことになるため採らない。
    #   deploy-supabase.yml も同じ理由で devenv 経由に揃えてある。
    #
    # ■ `supabase start` ではなく `supabase db start`
    #   pgTAP に要るのは Postgres だけ。公式の database-tests ワークフローも
    #   `supabase db start` を使う。フルスタックを起こすと数分無駄になる。
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # Postgres だけ起こす（pgTAP は API / Studio / Storage を要らない）
      - name: Start Postgres (supabase db start)
        run: supabase db start
      # 公式手順どおり pg_prove をコンテナで回す
      - name: Run pgTAP tests (supabase test db)
        run: test-db
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup || true

  e2e-web:
    name: E2E (Web / Maestro headless Chromium)
    runs-on: ubuntu-latest
    # UI テストと E2E は Supabase(Docker) と Next.js の起動が要るので、
    # lint / unit test より重い。壊れているものを土台に回しても意味が無いので
    # ci-check が緑になってから走らせる。
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
            frontend/tooling/*/node_modules
            drizzle/node_modules
          key: v2-${{ runner.os }}-node-modules-${{ hashFiles('frontend/bun.lock', 'drizzle/bun.lock') }}
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # ci-check job と同じ理由（execIfModified による install の skip）。
      - name: Sync JS dependencies (install into a lockfile-matched tree)
        run: |
          cd "$DEVENV_ROOT/frontend" && bun install --frozen-lockfile
          cd "$DEVENV_ROOT/drizzle"  && bun install --frozen-lockfile
      # `e2e-web` が Supabase の起動も Next.js の起動も面倒を見る
      # （scripts/e2e/maestro.sh の ensure_local_stack）。
      # Chromium は Maestro が Selenium 経由で自動取得する。
      - name: Run Maestro web suite (local profile)
        run: e2e-web
      # 落ちたときに**画面を見て**原因を判断できるようにする。
      # storyboard.html は data URI 埋め込みの自己完結 HTML なので、
      # ダウンロードしてブラウザで開けばそれだけで全フローのスクショが見られる。
      - name: Upload E2E artifacts (screenshots + storyboard + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-web-e2e
          path: |
            e2e-results/maestro/shots/
            e2e-results/maestro/storyboard.html
            e2e-results/maestro/report.xml
          retention-days: 14
      - name: Stop local services
        if: always()
        run: stop || true
