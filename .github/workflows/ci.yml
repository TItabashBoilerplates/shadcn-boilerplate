name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 同一 PR / branch で後続の push が来たら走行中の workflow をキャンセルし、
# main / develop への直接 push は最後まで走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 公式推奨: すべての `run:` を devenv shell 内で実行する。
# これにより `devenv:enterShell` hook が発火し、`before = [ "devenv:enterShell" ]`
# が付いた `setup:install-frontend` / `setup:install-drizzle` / `setup:install-backend`
# が lockfile 変更検知ベースで自動同期される（`bun install --frozen-lockfile` /
# `uv sync --frozen`）。
# Refs: https://devenv.sh/integrations/github-actions/
defaults:
  run:
    shell: devenv shell bash -- -e {0}

jobs:
  ci-check:
    name: CI Check (lint + format + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # キャッシュ対象:
      #   - `.devenv/`        : devenv-tasks の state DB (execIfModified ハッシュ) + uv venv
      #                         (UV_PROJECT_ENVIRONMENT=.devenv/state/venv)
      #   - `frontend/node_modules` 系 : Bun workspace の install 結果 (hoist 先)。
      #                                  これを cache しないと `setup:install-frontend` task が
      #                                  execIfModified で skip された際に node_modules が空で
      #                                  vitest 等が見つからない。
      #   - `drizzle/node_modules`     : drizzle 側の install 結果 (lint-ci:drizzle が利用)。
      # key は devenv 設定 + 全 lockfile の hash。lockfile が変われば再 install されて新キーで保存。
      - name: Cache devenv state and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .devenv
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
            frontend/tooling/*/node_modules
            drizzle/node_modules
          key: ${{ runner.os }}-devenv-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml', 'frontend/bun.lock', 'drizzle/bun.lock', 'backend-py/app/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-devenv-
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # `devenv test` (= ci:check aggregator) は process phase で Supabase Docker /
      # Storybook を起動してしまうため CI では使わず、配下の verify task を直接列挙する。
      - name: Run verify tasks
        run: |
          devenv tasks run \
            lint-ci:frontend \
            lint-ci:drizzle \
            lint-ci:backend-py \
            lint-ci:functions \
            lint-ci:fsd \
            format-check:frontend \
            format-check:drizzle \
            format-check:backend-py \
            format-check:functions \
            type-check:frontend \
            type-check:mobile \
            type-check:backend-py \
            type-check:functions

  test:
    name: Unit Tests (frontend + backend-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Cache devenv state and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .devenv
            frontend/node_modules
            frontend/apps/*/node_modules
            frontend/packages/*/node_modules
            frontend/tooling/*/node_modules
            drizzle/node_modules
          key: ${{ runner.os }}-devenv-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml', 'frontend/bun.lock', 'drizzle/bun.lock', 'backend-py/app/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-devenv-
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      - name: Run unit tests
        run: unit-test
