name: Deploy Supabase (config / functions / buckets)

# Vercel は `vercel_project.git_repository`（Terraform が接続）により push で自分から取りに来るが、
# **Supabase だけは pull 型にできない**（GitHub Integration の接続が Management API にも CLI にも
# 存在せず project ごとの dashboard 作業になるため。terraform/README.md 参照）。
# そこで push を拾ってこちらから配送するのがこの workflow の役割。
#
# 担当範囲は config.toml / Edge Functions / Storage buckets。
# Drizzle マイグレーションは migrate.yml、アプリ本体のビルドは Vercel の git 連携が担う。
#
# ⚠️ デプロイ順序は制御できない。main への push で Vercel のビルド・migrate.yml・この workflow が
#    並行して走る（Vercel の git 連携は Actions から待たせられない）。マイグレーションは
#    加算的（expand → contract）にして順序非依存にすること。

on:
  push:
    branches: [main, staging, develop]
    # Supabase に配送する対象が変わったときだけ起動する（無駄な run を避ける）。
    # supabase/tests/** は pgTAP 用でデプロイ対象ではないので入れない。
    paths:
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/templates/**"
      - "scripts/supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  # 手動実行: Actions タブ > "Deploy Supabase" > Run workflow で branch と対象環境を選ぶ。
  # production は GitHub Environment の deployment branch policy(main) + required reviewers に従う。
  workflow_dispatch:
    inputs:
      environment:
        description: "対象環境（手動実行時）"
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy:supabase
    runs-on: ubuntu-latest
    # production を選んだ run のみ承認ゲートがかかる（dev/staging は reviewers 無し = 自動）。
    # env スコープの variable / secret もここで選択した environment から解決される。
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment
        || (github.ref == 'refs/heads/main' && 'production')
        || (github.ref == 'refs/heads/staging' && 'staging')
        || 'dev' }}
    env:
      # ── デプロイ先の ref ──────────────────────────────────────────────────
      # **Terraform が GitHub Environment variable として書いた値**（secret ではない）。
      # project ref は https://<ref>.supabase.co の形で NEXT_PUBLIC_SUPABASE_URL として
      # ブラウザまで届く公開値なので variable でよく、ログに出せる分だけ取り違えに気づける。
      #
      # ⚠️ Doppler 経由では供給できない。`SUPABASE_` prefix を Doppler に登録すると
      #    その config の sync 全体が予約値違反で落ちる（.claude/rules/env-naming.md §1/§3）。
      #
      # ⚠️ 変数名が `SUPABASE_PROJECT_REF` **ではない**のは意図的。devenv の enterShell は
      #    `set -a; . env/<svc>/.env.$ENV` を行うため、その env ファイルが定義する変数は
      #    外から渡した同名の値を上書きする。env/backend/.env.local は実際に
      #    `SUPABASE_PROJECT_REF=`（空）を定義していた（本対応で削除済み）ので、
      #    同じ定義が `.env.<ENV>` に復活した瞬間に「ref が空のまま deploy が走る」事故になる。
      #    `DEPLOY_SUPABASE_PROJECT_REF` は
      #    devenv も env ファイルも定義しない名前なので確実に伝わり、
      #    scripts/supabase/lib.sh の sb_require_project_ref が SUPABASE_PROJECT_REF へ反映する。
      #    （migrate.yml の MIGRATE_POSTGRES_URL と同じ理由・同じ対策）
      DEPLOY_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      # ── Supabase Management API のトークン ────────────────────────────────
      # これは **secret** なので Doppler が正（.claude/rules/mcp-doppler.md）。
      # Doppler → GitHub のネイティブ sync が各 config を対応する GitHub Environment の
      # secrets に配っている（prd→production / stg→staging / dev→dev）。
      # Doppler 側は予約 prefix を避けて `SB_ACCESS_TOKEN` で保持しているので、
      # Supabase CLI が読む `SUPABASE_ACCESS_TOKEN` へここで読み替える
      # （scripts/infra/lib.sh の supabase_cli_auth / tf.sh の bridge_env と同じ方式）。
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SB_ACCESS_TOKEN }}

      # 値は GitHub から来るので devenv の Doppler ロードは行わない（doppler CLI 不使用）。
      DOPPLER_SKIP: "1"

      # ENV は Doppler config / env ファイル / profile の選択に使われる。
      ENV: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment
          || (github.ref == 'refs/heads/main' && 'production')
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'dev' }}
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # node_modules は不要（このジョブが使うのは supabase CLI だけで、
      # Edge Functions のバンドルは CLI 内蔵の esbuild が行う）。
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv

      # 適用前に、供給元の 2 系統が両方とも解決できていることを検証する。
      # どちらが欠けても「成功したように見えて何も届かない」形で失敗するため、ここで止める
      # （.claude/rules/error-handling.md: 握りつぶさない）。
      # ⚠️ ref は公開値なので表示してよい。access token は絶対に表示しない。
      - name: Verify deploy target resolved
        run: |
          if [ -z "${DEPLOY_SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::GitHub Environment '${ENV}' に Actions variable SUPABASE_PROJECT_REF がありません。infra-deploy <app>（terraform apply）を実行すると Terraform が書き込みます。"
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::GitHub Environment '${ENV}' に secret SB_ACCESS_TOKEN がありません。Doppler の該当 config（dev/stg/prd）に SB_ACCESS_TOKEN を投入し、Doppler → GitHub の sync を確認してください。"
            exit 1
          fi
          echo "✓ ENV=${ENV} / project ref=${DEPLOY_SUPABASE_PROJECT_REF}"

      # raw supabase CLI ではなく devenv task を使う（.claude/rules/commands.md 準拠）。
      # deploy:supabase = link → config push → buckets → functions。
      # supabase/config.toml が無い場合、config push と buckets は声を出してスキップされる
      # （CLI は config 不在時に既定値をロードするため、push するとリモートの Auth 設定を
      #  既定値で上書きしてしまう。scripts/supabase/deploy-config.sh のガード）。
      - name: Deploy Supabase resources
        run: devenv tasks run -P "$ENV" deploy:supabase

      # 手動実行（とくに production）の監査痕跡。
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deploy Supabase"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| profile / env | \`${ENV}\` |"
            echo "| project ref | \`${DEPLOY_SUPABASE_PROJECT_REF:-(unresolved)}\` |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref_name }}\` (\`${{ github.sha }}\`) |"
            echo "| actor | @${{ github.actor }} |"
            echo "| result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
