name: DB Migrate (Drizzle)

# PaaS ネイティブ Git 連携が config.toml / Edge Functions / Storage buckets を担うのに対し、
# **Drizzle マイグレーションだけ**はどの PaaS でも流せない（native は supabase/migrations/*.sql
# しか読まず、Drizzle は drizzle/migrations/ のフォルダ形式 = 対象外）。公式も「自前 ORM の
# migration は GitHub Actions で流せ」と明記。よってこの最小ワークフローが唯一の Actions
# デプロイ部品。設計の背景は docs/deployment/README.md / .claude/rules/database.md を参照。
#
# branch→env: main=production / staging=staging / develop=dev
# 本番(production)のみ GitHub Environment の required reviewers で手動承認ゲート（database.md 準拠）。
# dev/staging は自動適用。

on:
  push:
    branches: [main, staging, develop]
    # スキーマ/マイグレに関係する変更時のみ起動（無駄な run を避ける）
    paths:
      - "drizzle/schema/**"
      - "drizzle/migrations/**"
      - "drizzle/config/**"
      # migration ランナー自体の変更も反映対象（これが無いと runner を直しても流れない）
      - "drizzle/migrate.ts"
      - "drizzle/drizzle.config.ts"
      - "drizzle/package.json"
      - "drizzle/bun.lock"
      - ".github/workflows/migrate.yml"
  # 手動実行: Actions タブ > "DB Migrate (Drizzle)" > Run workflow で
  # branch と対象環境を選ぶ。production は GitHub Environment の
  # deployment branch policy(main) + required reviewers に従う。
  workflow_dispatch:
    inputs:
      environment:
        description: "対象環境（手動実行時）"
        type: choice
        options: [dev, staging, production]
        default: dev

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: db:migrate-deploy
    runs-on: ubuntu-latest
    # production を選んだ run のみ承認ゲートがかかる（dev/staging は reviewers 無し = 自動）。
    # env スコープの DOPPLER_TOKEN secret もここで選択した environment から解決される。
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment
        || (github.ref == 'refs/heads/main' && 'production')
        || (github.ref == 'refs/heads/staging' && 'staging')
        || 'dev' }}
    env:
      # 各 GitHub Environment に紐づく read-only Doppler service token（infra-bootstrap が投入）。
      # 上の environment: で選ばれた env スコープの secret が解決される。
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # ⚠️ ENV は **job env で渡すことが必須**。
      # devenv の base enterShell は `export ENV="${ENV:-local}"` なので、ここで渡さないと
      # 下の `defaults.run.shell` の `devenv shell` が **local として起動**し、
      #   1. loadEnvFilesForEnv が env/migration/.env.local を source →
      #      POSTGRES_URL=postgresql://...@127.0.0.1:54322/postgres（ローカル値）を掴む
      #   2. loadDopplerByEnv も local scope で走り、リモート config の値を取れない
      # という状態で migration が走ってしまう（本番に接続せず ECONNREFUSED で落ちる）。
      # ENV を渡せば env/<svc>/.env.<ENV> は存在しない＝ローカル値が入らず、
      # Doppler の該当 config（dev/stg/prd）から POSTGRES_URL が解決される。
      ENV: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment
          || (github.ref == 'refs/heads/main' && 'production')
          || (github.ref == 'refs/heads/staging' && 'staging')
          || 'dev' }}
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            drizzle/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('drizzle/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - name: Install devenv.sh
        shell: bash
        run: nix profile add nixpkgs#devenv
      # 接続先が Actions secret（DOPPLER_TOKEN）経由で解決できたことを、適用前に検証する。
      # loadDopplerByEnv は取得失敗しても警告のみで shell を止めないため、ここで明示的に落とす
      # （.claude/rules/error-handling.md: 握りつぶさない）。
      # ⚠️ POSTGRES_URL は DB パスワードを含むので **絶対に出力しない**。host:port だけ表示する。
      - name: Verify remote credentials resolved
        run: |
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN が空です。GitHub Environment '${ENV}' の env スコープ secret を確認してください（infra-bootstrap github が投入します）。"
            exit 1
          fi
          if [ -z "${POSTGRES_URL:-}" ]; then
            echo "::error::POSTGRES_URL を解決できませんでした。Doppler の該当 config に POSTGRES_URL があるか、token のスコープが一致しているか確認してください。"
            exit 1
          fi
          case "$POSTGRES_URL" in
            *127.0.0.1*|*localhost*)
              echo "::error::POSTGRES_URL がローカル値です（ENV=${ENV} が効かず env/*/.env.local を読んでいます）。リモート DB に適用されないため中止します。"
              exit 1 ;;
          esac
          # 認証情報を落として host:port のみ表示
          echo "✓ ENV=${ENV} / target=$(printf '%s' "$POSTGRES_URL" | sed -E 's|^[^@]*@||; s|[/?].*$||')"
      # raw drizzle-kit ではなく devenv task を使う（.claude/rules/commands.md 準拠）。
      # ENV は job env で渡し済みなので -P は profile を明示するための冗長指定。
      - name: Run Drizzle migrations
        run: devenv tasks run -P "$ENV" db:migrate-deploy
      # 手動実行（とくに production）の監査痕跡。run 一覧から「誰がどの env に流したか」が見える。
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### DB Migrate (Drizzle)"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| profile / env | \`${ENV}\` |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref_name }}\` (\`${{ github.sha }}\`) |"
            echo "| actor | @${{ github.actor }} |"
            echo "| result | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
